spring.application.name=caters_main_springboot


# ============================================
# Thymeleaf Configuration
# ============================================

# Location and extension of template files (defaults)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Template Cache: Set to 'false' for live reload during development, 'true' in production
spring.thymeleaf.cache=false

# Check that the template exists before rendering
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true

# Content-Type header on HTTP responses
spring.thymeleaf.servlet.content-type=text/html


#<-----DATABASE------>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/caters_springboot}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}


#<--------JPA------------>
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Multipart file upload limits (for video files)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Path where uploaded videos will be saved
file.upload-dir=uploads/videos/

file.caterer-image-dir=uploads/caterer-images/